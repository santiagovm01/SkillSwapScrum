<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar sesión - SkillSwap</title>
    <link rel="stylesheet" href="css/estilos.css">
    <script src="js/validaciones.js" defer></script>
</head>
<body>
<header class="header">
    <div class="logo">SkillSwap</div>
    <nav>
        <a href="index.html">Inicio</a>
        <a href="registro.html" class="btn-login">Registrarse</a>
    </nav>
</header>

<main class="main">
    <section class="card form-card">
        <h2>Iniciar sesión</h2>
        <p>Accede a tus habilidades, intercambios y mensajes.</p>

        <form action="../backend/autenticacion/iniciar_sesion.php" method="post">
            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input type="email" name="email" id="email" required>
            </div>

            <div class="form-group">
                <label for="contrasena">Contraseña</label>
                <input type="password" name="contrasena" id="contrasena" required>
            </div>

            <button type="submit" class="btn btn-primario" style="width: 100%;">Entrar</button>
        </form>

        <p style="margin-top: 12px; font-size: 13px;">
            ¿No tienes cuenta? <a href="registro.html">Crear cuenta</a>
        </p>
    </section>
</main>

<footer class="footer">
    © 2026 SkillSwap
</footer>
</body>
</html>
